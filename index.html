<script>
(function(){
'use strict';
/* 사태·암설류 1차원 물리 모델 (Voellmy형 + 질량 끌어안기 + 에너지 수지) */
var TUNE={mu0:0.06,mu1:0.03,xi0:200,xi1:200,xiUp:2800,xiA:900,xiB:300,xiC:20000,a0:3200,a1:4600,b0:5800,b1:7500,xiD:20000,d0:20000,d1:30000,fk:1.45};
var AV=(function(){
var g=9.81, SREL=3300, LA=SREL+5600, LTOT=SREL+38000, SLOPE0=0.906;
/* 실제 사건 경로의 고도(출발점에서 x km, 해발 m): 지도·보도를 바탕으로 어림한 값 */
var ZREF=2190; /* 낙차 H의 기준 높이 = 렌데강 합류점(출발점에서 5.6 km)의 해발 */
var KX=[0,1500,3200,5600,9000,14000,19600,25000,30000,38000], KZ=[5190,4300,3100,2190,2090,1950,1800,1650,1500,1250];
var KM=(function(){var n=KX.length,d=[],m=[],i;for(i=0;i<n-1;i++)d.push((KZ[i+1]-KZ[i])/(KX[i+1]-KX[i]));
  m.push(d[0]);for(i=1;i<n-1;i++)m.push(d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2);m.push(d[n-2]);
  for(i=0;i<n-1;i++){if(d[i]===0){m[i]=0;m[i+1]=0;}else{var a=m[i]/d[i],b=m[i+1]/d[i],h=Math.hypot(a,b);if(h>3){m[i]=3*a/h*d[i];m[i+1]=3*b/h*d[i];}}}
  return m;})();
function zRel(x){ /* x: 출발점으로부터 거리(m) */
  if(x<0)return KZ[0]-SLOPE0*x;
  if(x>=KX[KX.length-1])return KZ[KZ.length-1]-0.03*(x-KX[KX.length-1]);
  var i=0;while(x>KX[i+1])i++;
  var h=KX[i+1]-KX[i],t=(x-KX[i])/h,t2=t*t,t3=t2*t;
  return (2*t3-3*t2+1)*KZ[i]+(t3-2*t2+t)*h*KM[i]+(-2*t3+3*t2)*KZ[i+1]+(t3-t2)*h*KM[i+1];
}
function zProf(s){return zRel(s-SREL);}
function slopeProf(s){var d=1;return (zProf(s)-zProf(s+d))/d;}       /* tanθ (내리막이 +) */
function s0For(H){
  var z0=ZREF+H;if(z0>=KZ[0])return SREL-(z0-KZ[0])/SLOPE0;
  var lo=0,hi=KX[KX.length-1];for(var k=0;k<50;k++){var mid=(lo+hi)/2;if(zRel(mid)>z0)lo=mid;else hi=mid;}
  return SREL+(lo+hi)/2;
}
function widthAt(s,sv){
  return s<LA?200-100*clamp01(s/LA):70+22*Math.sin(s/650)+14*Math.sin(s/230+1);
}
function xiAt(s){
  var x=s-SREL,t1=sst(TUNE.a0,TUNE.a1,x),t2=sst(TUNE.b0,TUNE.b1,x);
  var l=Math.log(TUNE.xiA)*(1-t1)+Math.log(TUNE.xiB)*t1;l=l*(1-t2)+Math.log(TUNE.xiC)*t2;var t3=sst(TUNE.d0,TUNE.d1,x);return Math.exp(l*(1-t3)+Math.log(TUNE.xiD)*t3);
}
function sst(a,b,x){var t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);}
function clamp01(x){return Math.max(0,Math.min(1,x));}
/* p: {H,m,water(0~0.6),entr(0~1),D(km, 강 위 마을 위치)} */
function params(p){
  var w=p.water;
  var k=w/0.6;return {mu:TUNE.mu0-(TUNE.mu0-TUNE.mu1)*k,xi:TUNE.xi0+(TUNE.xi1-TUNE.xi0)*k,rho:2300-700*k};
}
function run(p){
  var pr=params(p),s0=s0For(p.H),sv=LA+p.D*1000,dt=0.05,s=s0,v=1.5,m=p.m,t=0;
  var out={t:[],s:[],v:[],m:[],h:[],Ek:[],Eg:[],Ef:[],Ed:[],Ee:[],sv:sv,s0:s0,pr:pr,pv:null,tv:null,stopped:false};
  var Eg=0,Ef=0,Ed=0,Ee=0,vmax=0,smax=s0,rec=0,hmin=1;
  var Lb0=350,V0=2.6e5;
  while(t<3600){
    var th=Math.atan(slopeProf(s)),sn=Math.sin(th),cs=Math.cos(th);
    var W=widthAt(s,sv),Lb=Lb0+0.05*(s-s0),h=Math.min(40,Math.max(hmin,(m/pr.rho)/(W*Lb)));
    var muE=pr.mu*Math.pow((m/pr.rho)/V0,-0.157),af=muE*g*cs*(1+TUNE.fk*sst(TUNE.d0,TUNE.d1,s-SREL)),ad=g*v*v/(xiAt(s)*h);
    /* 끌어안기: 길 위의 눈·퇴적물 (단위 길이당 질량) */
    var q=(s<LA?300*W*1.0:1400*W*0.25),dm=p.entr*q*v*dt;
    var a=g*sn-af-ad-(v*dm/dt)/m;
    /* 에너지 적분 */
    Eg+=m*g*sn*v*dt;Ef+=m*af*v*dt;Ed+=m*ad*v*dt;Ee+=0.5*v*v*dm;
    v+=a*dt;if(v<0)v=0;s+=v*dt;m+=dm;t+=dt;
    if(v>vmax)vmax=v;
    if(rec++%10===0){out.t.push(t);out.s.push(s);out.v.push(v);out.m.push(m);out.h.push(h);out.Ek.push(0.5*m*v*v);out.Eg.push(Eg);out.Ef.push(Ef);out.Ed.push(Ed);out.Ee.push(Ee);}
    if(out.tv===null&&s>=sv){out.tv=t;out.vv=v;out.mv=m;out.hv=h;out.Ekv=0.5*m*v*v;out.Egv=Eg;out.Efv=Ef;out.Edv=Ed;out.Eev=Ee;}
    if(v<0.3&&sn*g-af<0&&t>5){out.stopped=true;break;}
    if(s>LTOT-50)break;
    if(out.tv!==null&&t>out.tv+60)break;
  }
  out.vmax=vmax;out.tEnd=t;out.sEnd=s;
  out.reached=out.tv!==null;
  return out;
}
return {ZREF:ZREF,TUNE:TUNE,run:run,zProf:zProf,s0For:s0For,widthAt:widthAt,params:params,LA:LA,LTOT:LTOT,SREL:SREL,slopeProf:slopeProf,g:g};
})();


function hash2(x,y){var n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function vnoise(x,y){var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  var a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return lerp(lerp(a,b,u),lerp(c,d,u),v);}
function fbm(x,y){return vnoise(x,y)*0.6+vnoise(x*2.1,y*2.1)*0.28+vnoise(x*4.3,y*4.3)*0.12;}
function persp(f,a,n,fr){var t=1/Math.tan(f/2),nf=1/(n-fr);return new Float32Array([t/a,0,0,0, 0,t,0,0, 0,0,(fr+n)*nf,-1, 0,0,2*fr*n*nf,0]);}
function lookAt(e,c,u){
  var zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2],l=Math.hypot(zx,zy,zz)||1;zx/=l;zy/=l;zz/=l;
  var xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz)||1;xx/=l;xy/=l;xz/=l;
  var yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;

    for(var c=0;c<NCf;c+=1){

/* ===== 강물 띠: 빛을 반사하고 흐르는 물결과 하얀 거품 (합류점 아래쪽 강) ===== */

  for(k=0;k<=rows;k++){var sU=s0+k*st,f=frame(sU);
    for(j=0;j<NJ;j++){var u=-1+2*j/(NJ-1),o=u*0.58,w=Math.max(0.5,1.0+0.25*Math.sin(sU*0.7)+0.15*Math.sin(sU*1.9));o*=w;
      P.push(f.x+o*f.nx,groundAt(sU,o*0.4)+0.075,sU+o*f.nz);U.push(u,sU,0);}}

  function V(r,c){var q=(r*NJ+c)*3;pos.push(P[q],P[q+1],P[q+2]);uv.push(U[q],U[q+1],0);}
  for(k=0;k<rows;k++)for(j=0;j<NJ-1;j++){V(k,j);V(k+1,j);V(k,j+1);V(k,j+1);V(k+1,j);V(k+1,j+1);}

/* ===== 동적 메시 (흐름 덩어리 / 쌓인 퇴적물 / 파편) ===== */

  for(var i=0;i<3;i++){DN[o+i*3]=nx;DN[o+i*3+1]=ny;DN[o+i*3+2]=nz;DC[o+i*3]=r;DC[o+i*3+1]=g;DC[o+i*3+2]=b;}

/* ===== 언덕 위 풍력발전 단지 (15 MW급 초대형 10기) ===== */
var WNP={hub:150,R:118,nac:[20,9,8]},WDS=3;   /* 계산은 실제 크기, 화면에는 3배로 크게(다른 놀이기구처럼 과장) */
function wtSites(){
  /* 지형 그물의 꼭짓점(화면에 그려지는 높이와 똑같은 곳)에서만 고르고, 주변보다 솟은 곳을 골라요 */
  var OF=fOff(),c=[],PGs=(typeof PG!=='undefined'&&PG.st)?PG.st:[],ci,s;
  var cols=[];OF.forEach(function(o,i){if(Math.abs(o)>=24&&Math.abs(o)<=40)cols.push(i);});
  for(s=400;s<=520;s+=0.5)cols.forEach(function(i){var o=OF[i],h=visH(s,o),av=(visH(s-1.5,o)+visH(s+1.5,o)+visH(s,OF[i-1])+visH(s,OF[i+1]))/4,pr=(h-av)*UV;
    if(pr>3)c.push({s:s,o:o,pr:pr,h:h});});
  c.sort(function(a,b){return b.pr-a.pr;});
  var out=[];
  for(var i=0;i<c.length&&out.length<10;i++){var q=c[i],ok=true;
    out.forEach(function(r){if(Math.hypot(r.s-q.s,r.o-q.o)<11)ok=false;});
    PGs.forEach(function(st){if(Math.hypot(st.s-q.s,st.o-q.o)<7)ok=false;});
    if(ok)out.push(q);}
  return out;
}
function wtBuild(L){
  var S=wtSites();PLT.wt=S;
  S.forEach(function(q,i){
    var f=frame(q.s),hd=Math.atan2(f.tz,f.tx),base=wpos(q.s,q.o,0),g=Math.min(visH(q.s,q.o),visH(q.s-0.5,q.o),visH(q.s+0.5,q.o))-0.15,HH2=WNP.hub*WDS/UV;
    q.hd=hd;q.base=base;q.g=g;q.alt=(g+0.15)*UV;q.ph=i*1.3;q.vw=9.5+((i*37)%7)*0.45;
    addBox(L,base[0],g-1.6,base[2],0.5*WDS,1.75,0.5*WDS,0,PLC.conc);                          /* 기초 */
    for(var k=0;k<8;k++){var t0=k/8,r=(4.2-1.8*t0)*WDS/UM;for(var m=0;m<3;m++)addBox(L,base[0],g+0.15+HH2*t0,base[2],r*2,HH2/8+0.01,r*2,m*Math.PI/6,k===0?[0.75,0.78,0.8]:[0.95,0.96,0.97]);}
    var top=g+0.15+HH2,cx=Math.cos(hd),sx=Math.sin(hd),nl=WNP.nac[0]*WDS/UM;
    addBox(L,base[0]-cx*nl*0.15,top-0.05,base[2]-sx*nl*0.15,nl,WNP.nac[1]*WDS/UV,WNP.nac[2]*WDS/UM,hd,[0.95,0.96,0.97]);    /* 나셀(발전기 집) */
    addBox(L,base[0]-cx*nl*0.55,top+WNP.nac[1]*WDS/UV-0.02,base[2]-sx*nl*0.55,0.06*WDS,0.05*WDS,0.06*WDS,0,[0.6,0.6,0.62]);             /* 풍속계 */
    q.hub=[base[0]+cx*nl*0.42,top+WNP.nac[1]*WDS/UV*0.45,base[2]+sx*nl*0.42];

}
function wtDyn(L,tm){

    for(var b=0;b<3;b++){var a=ang+b*2*Math.PI/3,d=[N[0]*Math.cos(a),Math.sin(a),N[2]*Math.cos(a)],prev=H;

function wtPow(q){var rho=1.225*Math.exp(-(q.alt+WNP.hub)/8500),A=Math.PI*WNP.R*WNP.R,v=q.vw,Pw=0.5*rho*A*v*v*v,Pe=Math.min(15e6,Pw*0.45);return {rho:rho,A:A,v:v,Pw:Pw,Pe:Pe};}

/* ===== 움직이는 부분 (물줄기·수차·전기·풍차) ===== */
function plDyn(L,tm){

    for(i=0;i<8;i++){var t=((tm*(0.12+flow*0.3)+i/8+u*0.17)%1)*(n-0.2),k=Math.floor(t),f=t-k,a=pts[k],b=pts[Math.min(n,k+1)];
      var p0=[lerp(a[0],b[0],f),lerp(a[1],b[1],f),lerp(a[2],b[2],f)],f2=Math.min(1,f+0.35),p1=[lerp(a[0],b[0],f2),lerp(a[1],b[1],f2),lerp(a[2],b[2],f2)];
      pbox(L,p0,p1,0.215,0.215,PLC.blue);}});

  PLU.forEach(function(lx,u){
    var C=wpos(sP+lx-0.1,oP,PLT.yT),jw=0.1+0.18*flow,N=wpos(sP+lx-0.1,oP+side*1.2,PLT.yN),Q0=wpos(sP+lx-0.1,oP+side*0.08,PLT.yN);
    pbox(L,N,Q0,jw,jw,[0.65,0.88,1.0]);
    for(i=0;i<6;i++){var ph=tm*6+i*1.7+u,sx=0.3*Math.sin(ph),sy=0.3+0.3*Math.abs(Math.cos(ph*0.7));
      obb(L,[Q0[0]+Uv[0]*sx-Vv[0]*side*0.2,Q0[1]+sy,Q0[2]+Uv[2]*sx-Vv[2]*side*0.2],[1,0,0],[0,1,0],0.1,0.1,0.1,[0.95,0.98,1.0]);}
    var a0=ang+u*0.7;

    for(i=0;i<6;i++){var a2=a0+i*Math.PI/3,r2=rad(a2);obb(L,[C[0]+r2[0]*R*0.5,C[1]+r2[1]*R*0.5,C[2]+r2[2]*R*0.5],r2,Uv,R*0.5,0.06,0.06,PLC.steel);}
    for(i=0;i<20;i++){var a3=a0+i*Math.PI/10,r3=rad(a3),tg3=[-Vv[0]*Math.sin(a3),Math.cos(a3),-Vv[2]*Math.sin(a3)];

  });

  for(i=0;i<6;i++){var t2=(tm*0.4+i/6)%1,g0=wpos(sP+5,oP,PLT.yL+0.2),g1=wpos(sP-10.4,oP,PLT.yL+0.2);obb(L,[lerp(g0[0],g1[0],t2),g0[1],lerp(g0[2],g1[2],t2)],[1,0,0],[0,1,0],0.18,0.12,0.12,PLC.yel);}
  var wp=PLT.wire,m=wp.length-1;

}

  var Q=PLT.Q,H=PLT.H,Pw=1000*EXG*Q*H,Pp=Pw*PLE.pipe,Pt=Pp*PLE.turb,Pe=Pt*PLE.gen;

      exMsg('그네에서 뛰어내렸어요! 내려가던 속도 '+fN(Math.abs(SW.L*w),1)+' m/s 그대로 포물선을 그려요');

function pgRide(dt){
  var E=EX,R=E.ride,k=R.k,i;if(k!=='rocket'&&k!=='soyuz')R.t+=dt;if(k==='soyuz'){syStep(R,dt);return;}if(p5Is(k)){p5Step(R,dt);return;}if(k==='tw'||k==='twd'){twStep(R,dt);return;}
  if(R.run){
    var S=R.run;
    if(k==='slide')S.mu=PG.mu;else if(k==='ski')S.mu=PG.muSki;else if(k==='piste')S.mu=PG.muPi;else if(k==='water'||k==='wtower')S.mu=PG.muWa;else if(k==='zip')S.mu=PG.muZip;else if(k==='alp'){S.mu=PG.muAlp;S.ub=!!(E.keys.s||E.keys.down||E.jy>0.5);}else if(S.T.isCo)S.mu=PG.muCo;
    var ts=R.ts||1,n=Math.ceil(4*ts);for(i=0;i<n&&!S.done;i++)pgAdv(S,dt*ts/n);
    var p=pgPos(S),sg=S.sg;
    E.s=p.s;E.off=p.o;E.y=p.y+R.eo;
    E.vh=[sg.dx/sg.L*S.v,sg.dz/sg.L*S.v];E.vy=(-sg.dy/sg.L)*S.v;E.lost=S.heat;E.air=true;
    if(S.T.isCo){
      var psi=p.psi,dxh=sg.dx*Math.cos(psi)+sg.dz*(-Math.sin(psi));E.avp=Math.atan2(sg.dy,dxh);E.hdg=psi;
      var dy3=E.hdg-E.yaw;while(dy3>Math.PI)dy3-=2*Math.PI;while(dy3<-Math.PI)dy3+=2*Math.PI;E.yaw+=dy3*Math.min(1,dt*1.2*ts);
      R.hmax=Math.max(R.hmax||0,p.y-S.T.base);
    }else{
      var th=Math.atan2(sg.dz,sg.dx),da=th-E.hdg;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;E.hdg+=da*Math.min(1,dt*6);
      var dy2=E.hdg-E.yaw;while(dy2>Math.PI)dy2-=2*Math.PI;while(dy2<-Math.PI)dy2+=2*Math.PI;E.yaw+=dy2*Math.min(1,dt*1.6);
    }
    E.spd=0;E.anim+=S.v*dt*0.05;
    if(S.done)pgEnd(false);
    return;
  }
  if(k==='rocket'){pgRocketStep(R,dt);return;}
  if(k==='bungee'){pgBungeeStep(R,dt);return;}
  if(k.indexOf('para')===0){pgParaStep(R,dt);return;}
  if(k==='gvault'){pgGVStep(R,dt);return;}
  if(k==='swing'){
    var SW=PG.SW,L=SW.L,pump=(E.keys.w||E.keys.up)?1:0,brake=(E.keys.s||E.keys.down)?1:0,N=10*(R.ts||1),h=dt*(R.ts||1)/N,m=E.mass;
    for(i=0;i<N;i++){
      var acc=-(EXG/L)*Math.sin(R.th)-0.012*R.w,en=0.5*R.w*R.w+(EXG/L)*(1-Math.cos(R.th));
      if(pump&&en<(EXG/L)*(1-Math.cos(1.15)))acc+=0.32*(R.w>=0?1:-1);
      if(brake)acc-=0.5*R.w;
      R.heat=(R.heat||0)+m*L*L*(0.012+(brake?0.5:0))*R.w*R.w*h;
      R.w+=acc*h;var tn=R.th+R.w*h;
      var sy=SW.yP-L*Math.cos(tn),so=SW.o-L*Math.sin(tn)/UM;
      if(sy-4.5<exGround(SW.s,so)+3){R.w=-R.w*0.3;}else R.th=tn;
    }
    R.maxTh=Math.max(R.maxTh,Math.abs(R.th));
    var th2=R.th;E.s=SW.s;E.off=SW.o-L*Math.sin(th2)/UM;E.y=SW.yP-L*Math.cos(th2)+R.eo;
    E.vh=[0,-L*R.w*Math.cos(th2)];E.vy=L*R.w*Math.sin(th2);E.lost=R.heat||0;E.air=true;E.hdg=-Math.PI/2;E.spd=0;
    if(E.jumpEdge){E.jumpEdge=false;pgEnd(false);}
    return;
  }
  if(k==='tramp'){
    var T=PG.T,m2=E.mass,N2=5*(R.ts||1),h2=dt*(R.ts||1)/N2,fw=(E.keys.w||E.keys.up?1:0)-(E.keys.s||E.keys.down?1:0)-E.jy,st2=(E.keys.d||E.keys.right?1:0)-(E.keys.a||E.keys.left?1:0)+E.jx;
    var cy=Math.cos(E.yaw),sy2=Math.sin(E.yaw),ds=fw*cy-st2*sy2,dO=fw*sy2+st2*cy,mg=Math.hypot(ds,dO);if(mg>1){ds/=mg;dO/=mg;}
    var ns=E.s+ds*9*dt/UM,no=E.off+dO*9*dt/UM,rr=Math.hypot(ns-T.s,no-T.o);if(rr>T.R*0.9){ns=T.s+(ns-T.s)*T.R*0.9/rr;no=T.o+(no-T.o)*T.R*0.9/rr;}
    E.s=ns;E.off=no;if(mg>0.05)E.hdg=Math.atan2(dO,ds);
    for(i=0;i<N2;i++){
      var x=Math.max(0,T.bed-E.y),a=-EXG;
      if(x>0){a+=T.w2*x-T.cd*E.vy;if(E.keys.space&&E.vy>0)a+=14;R.heat+=m2*T.cd*E.vy*E.vy*h2;}
      E.vy+=a*h2;E.y+=E.vy*h2;
      if(E.y<T.bed-T.maxX){E.y=T.bed-T.maxX;if(E.vy<0)E.vy=0;}
    }
    R.x=Math.max(0,T.bed-E.y);E.el=0.5*m2*T.w2*R.x*R.x;E.vh=[0,0];E.lost=R.heat;E.air=true;E.spd=0;E.jumpEdge=false;
    R.hmax=Math.max(R.hmax||0,E.y-T.bed);
  }
}

function pgLoopVs(T){

/* 상승기류 표시: 독수리가 원을 그리며 올라가요 (화면에선 크게) */
function pgThermDyn(L,tm){
  if(!PG.PA||!PG.PA.th)return;
  PG.PA.th.forEach(function(t,i){var g=t.g0||(t.g0=exGround(t.s,t.o));
    for(var k=0;k<3;k++){var a=tm*0.25+k*2.1+i,h=g+350+((tm*12+k*150+i*60)%600),r=t.R*0.45,s=t.s+Math.cos(a)*r,o=t.o+Math.sin(a)*r,p=pgW(s,o,h);
      var dx=-Math.sin(a),dz=Math.cos(a),f=frame(s),hx=dx*f.tx+dz*f.nx,hz=dx*f.tz+dz*f.nz,ry=Math.atan2(hz,hx),fl=Math.sin(tm*2+k)*0.1;
      addBox(L,p[0],p[1],p[2],0.22,0.06,0.07,ry,[0.32,0.24,0.16]);
      var wx=-Math.sin(ry),wz=Math.cos(ry);[-1,1].forEach(function(q){addBox(L,p[0]+wx*q*0.2,p[1]+0.02+fl*0.3,p[2]+wz*q*0.2,0.12,0.02,0.36,ry,[0.25,0.18,0.12]);});
      addBox(L,p[0]+Math.cos(ry)*0.13,p[1]+0.02,p[2]+Math.sin(ry)*0.13,0.06,0.05,0.05,ry,[0.95,0.95,0.92]);}
  });
}

/* ===== 초고층 타워(버즈 칼리파형, 828 m) + 초고속 엘리베이터 + 꼭대기 전망 라운지 =====
   높이·모양은 버즈 칼리파(828 m, Y자 평면, 나선형으로 줄어드는 층)를 본떴어요.
   엘리베이터: 최고 속도 18 m/s(약 65 km/h), 가속도 1.0 m/s² — 세계 최고속 엘리베이터(약 20 m/s)에 가까운 값이에요.
   (실제 버즈 칼리파 엘리베이터는 약 10 m/s 예요.) */
var TWP={H:828,hL:600,vmax:18,acc:1.0,cabM:5000};
function twSite(){
  var S0=PG.S0,obs=[],k;
  for(k in PG){var v=PG[k];if(!v||typeof v!=='object')continue;
    if(Array.isArray(v.pts))for(var i=0;i<v.pts.length;i+=3){var q=v.pts[i];if(q&&isFinite(q.s)&&isFinite(q.o))obs.push([q.s,q.o]);}
    if(isFinite(v.s)&&isFinite(v.o))obs.push([v.s,v.o]);
    if(v.c&&isFinite(v.c.s))obs.push([v.c.s,v.c.o]);}
  (PG.COS||[]).forEach(function(T){for(var i=0;i<T.pts.length;i+=3)obs.push([T.pts[i].s,T.pts[i].o]);});
  var best=null;
  for(var s=S0-20;s<=S0-2;s+=0.5)for(var o=9;o<=21;o+=0.5){
    var dmin=1e9;obs.forEach(function(p){dmin=Math.min(dmin,Math.hypot(p[0]-s,p[1]-o));});if(dmin<3.2)continue;
    var g0=exGround(s,o),sl=0;for(var a=0;a<6;a++){var an=a*Math.PI/3;sl=Math.max(sl,Math.abs(exGround(s+Math.cos(an)*1.3,o+Math.sin(an)*1.3)-g0));}
    var sc=sl+Math.abs(s-(S0-9))*4+Math.abs(o-14)*3-Math.min(dmin,6)*5;
    if(!best||sc<best.sc)best={s:s,o:o,sc:sc};}
  return best||{s:S0-9,o:14};
}
function twBuild(L){
  var st=twSite(),s=st.s,o=st.o,g=pgGmax(s,o,1.3)-2,f=frame(s),T=[f.tx,0,f.tz],N=[f.nx,0,f.nz],H=TWP.H,hL=TWP.hL,i,w;
  var W=PG.TW={s:s,o:o,g:g,cab:g+2,dir:1};
  function dir(a){return [T[0]*Math.cos(a)+N[0]*Math.sin(a),0,T[2]*Math.cos(a)+N[2]*Math.sin(a)];}
  var base=pgW(s,o,0),Y=[0,1,0],GL=[0.6,0.7,0.82],GL2=[0.5,0.6,0.74],MU=[0.86,0.89,0.93];
  function at(d,r,y){return [base[0]+d[0]*r/UM,y/UV,base[2]+d[2]*r/UM];}
  /* 받침(지형 위 기단) */
  pgLB(L,s,o,0,0,g-30,32,2.6,2.6,[0.78,0.76,0.72]);
  /* 가운데 기둥(코어) */
  var NT=22;
  for(i=0;i<NT;i++){var y0=g+2+i*(700/NT),y1=y0+700/NT,t=i/NT,cw=(30-12*t)/UM;
    obb(L,at([0,0,0],0,(y0+y1)/2),T,Y,cw/2,(y1-y0)/2/UV,cw/2,i%2?GL:GL2);
    /* 세 날개: 위로 갈수록 나선처럼 하나씩 짧아져요 */
    for(w=0;w<3;w++){var a=Math.PI/2+w*2*Math.PI/3,step=Math.floor((i+w*2.4)/3)*3/(NT+6),Lw=Math.max(6,64*(1-Math.pow(step,0.9))),d=dir(a);
      if(Lw<8&&i>NT*0.75)continue;
      obb(L,at(d,Lw/2,(y0+y1)/2),d,Y,Lw/2/UM,(y1-y0)/2/UV,11/UM,(i+w)%2?GL:GL2);
      obb(L,at(d,Lw/2,y1-1),d,Y,Lw/2/UM+0.004,1.5/UV,11.5/UM,MU);   /* 층 띠 */
      obb(L,at(d,Lw,(y0+y1)/2),d,Y,1.2/UM,(y1-y0)/2/UV,12/UM,MU);}    /* 날개 끝 기둥 */
  }
  /* 첨탑(700 → 828 m) */
  for(i=0;i<8;i++){var ya=g+2+700+i*16,r=(9-i)*0.9;obb(L,at([0,0,0],0,ya+8),T,Y,r/UM,8/UV,r/UM,i%2?MU:[0.75,0.8,0.86]);}
  obb(L,at([0,0,0],0,g+2+H+3),T,Y,0.02,3/UV,0.02,[2.2,0.3,0.2]);   /* 항공 경고등 */
  /* 꼭대기 전망 라운지(지상 600 m): 넓게 튀어나온 바닥 + 낮은 유리 난간 + 소파·망원경 */
  var yD=g+2+hL;W.deck=yD+4;
  pgLB(L,s,o,0,0,yD-6,10,2.3,2.3,[0.85,0.86,0.88]);
  pgLB(L,s,o,0,0,yD+3.5,0.6,2.2,2.2,[0.93,0.9,0.84]);
  [[0,1.12,2.24,0.04],[0,-1.12,2.24,0.04],[1.12,0,0.04,2.24],[-1.12,0,0.04,2.24]].forEach(function(q){pgLB(L,s,o,q[0],q[1],yD+4,9,q[2],q[3],[0.65,0.88,1.0]);pgLB(L,s,o,q[0],q[1],yD+13,1.2,q[2]+0.02,q[3]+0.02,MU);});
  for(i=0;i<6;i++){var an2=i*Math.PI/3,lx=Math.cos(an2)*0.75,lz=Math.sin(an2)*0.75;pgLB(L,s,o,lx,lz,yD+4,3,0.22,0.1,[0.75,0.3,0.25]);pgLB(L,s,o,lx,lz,yD+7,4,0.22,0.03,[0.75,0.3,0.25]);}
  for(i=0;i<4;i++){var an3=i*Math.PI/2+Math.PI/4,lx2=Math.cos(an3)*1.0,lz2=Math.sin(an3)*1.0;pgLB(L,s,o,lx2,lz2,yD+4,8,0.03,0.03,[0.3,0.3,0.32]);pgLB(L,s,o,lx2,lz2,yD+12,2.5,0.09,0.04,[0.2,0.22,0.26]);}
  pgLB(L,s,o,-0.45,0.45,yD+4,5,0.5,0.14,[0.55,0.38,0.24]);                      /* 카페 카운터 */
  PG.solids.push({s:s,o:o,hs:1.12,ho:1.12,top:W.deck});
  /* 바깥 유리 엘리베이터 레일(날개 사이) */
  var ea=Math.PI/2+Math.PI/3,ed=dir(ea),er=26;W.ed=ed;W.er=er;
  var es=s+(ed[0]*T[0]+ed[2]*T[2])*er/UM,eo=o+(ed[0]*N[0]+ed[2]*N[2])*er/UM;W.es=es;W.eo=eo;
  [-1,1].forEach(function(q){var side=[-ed[2],0,ed[0]];var p0=at(ed,er+6,g),p1=at(ed,er+6,yD+4);p0[0]+=side[0]*q*7/UM;p0[2]+=side[2]*q*7/UM;p1[0]+=side[0]*q*7/UM;p1[2]+=side[2]*q*7/UM;pbox(L,p0,p1,0.05,0.05,[0.25,0.27,0.3]);});
  /* 1층 입구 */
  var ent=at(ed,er+16,g);obb(L,[ent[0],(g+8)/UV,ent[2]],ed,Y,0.12,8/UV,0.3,[0.3,0.32,0.36]);
}
function twStations(){
  var W=PG.TW;if(!W)return [];
  var bs=W.s+(W.es-W.s)*1.9,bo=W.o+(W.eo-W.o)*1.9;
  W.bs=bs;W.bo=bo;
  return [{k:'tw',n:'🏙 초고층 타워 828 m · 초고속 엘리베이터',s:bs,o:bo,y:exGround(bs,bo),r:0.75},
          {k:'twd',n:'🌇 꼭대기 전망 라운지 (지상 600 m)',s:W.s+0.6,o:W.o-0.6,y:W.deck,r:0.7}];
}

/* ===== 3D 모습: 팰컨 9형(흰 1단·검은 단간부·2단·캡슐, 엔진 9개, 착륙다리 4개, 격자날개 4개) ===== */
function rkStage1(L,ds,dO,y0,legs,fins,thr,tm,n){
  var D=F9.D,K=PG.RK,i;
  rkCyl(L,ds,dO,y0,41,D,PGC.white);
  rkCyl(L,ds,dO,y0+41,6,D*1.01,PGC.black);
  rkCyl(L,ds,dO,y0+0.5,2.5,D*1.02,PGC.black);
  /* 엔진 9개(옥타웹) */
  for(i=0;i<9;i++){var a=i*Math.PI/4,r=i<8?1.25:0;rkCyl(L,ds+Math.cos(a)*r,dO+Math.sin(a)*r,y0-1.6,1.6,0.9,[0.25,0.25,0.28]);}
  /* 착륙 다리 4개 */
  [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(q){var top=[ds+q[0]*D*0.5,dO+q[1]*D*0.5,y0+11],foot=legs>0?[ds+q[0]*(D*0.5+8*legs),dO+q[1]*(D*0.5+8*legs),y0-1.5*legs]:[ds+q[0]*(D*0.5+0.15),dO+q[1]*(D*0.5+0.15),y0+0.5];
    rkBar(L,K,top,foot,0.7,[0.12,0.12,0.14]);});
  /* 격자날개 4개 */
  [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(q){var out=fins?1.6:0.25;rkB(L,ds+q[0]*(D*0.5+out*0.5),dO+q[1]*(D*0.5+out*0.5),y0+39,1.6,q[0]?out:1.2,q[1]?out:1.2,[0.3,0.3,0.32],0);});
  if(thr>0.02){var fl=(n||9)/9*thr*(30+4*Math.sin(tm*40)),fw=D*(n===9?1.1:0.6);
    rkCyl(L,ds,dO,y0-1.6-fl*0.45,fl*0.45,fw,[1.0,0.92,0.6]);rkCyl(L,ds,dO,y0-1.6-fl*0.8,fl*0.35,fw*0.7,[1.0,0.62,0.2]);rkCyl(L,ds,dO,y0-1.6-fl,fl*0.2,fw*0.45,[0.9,0.32,0.12]);}
}
function rkUpper(L,ds,dO,y0,s2,thr,tm){
  var D=F9.D;
  if(s2){rkCyl(L,ds,dO,y0,10,D,PGC.white);rkCyl(L,ds,dO,y0-2.2,2.2,1.6,[0.22,0.22,0.25]);
    if(thr>0.02){var fl=18+3*Math.sin(tm*30);rkCyl(L,ds,dO,y0-2.2-fl,fl,1.2,[0.85,0.9,1.0]);}y0+=10;}
  rkCyl(L,ds,dO,y0,3.6,D,[0.92,0.92,0.94]);rkB(L,ds,dO,y0+1.2,0.6,D*0.92,D*0.92,PGC.black,0);   /* 트렁크 */
  [[1,0.92],[2.2,0.8],[3.4,0.66],[4.4,0.5],[5.2,0.32]].forEach(function(q,ix){rkCyl(L,ds,dO,y0+3.6+(ix?[0,1.1,2.2,3.2,4.0][ix]:0),1.2,D*q[1],ix<4?PGC.white:[0.2,0.2,0.24]);});
  rkB(L,ds+D*0.38,dO,y0+5.4,0.9,0.5,0.6,PGC.dark,0);   /* 창문 */
}
function rkChutes(L,ds,dO,y,main,tm){
  var K=PG.RK,n=main?4:2,rr=main?14:4,hh=main?40:22;
  for(var i=0;i<n;i++){var a=i*Math.PI*2/n+0.4,cs=ds+Math.cos(a)*rr*0.9,co=dO+Math.sin(a)*rr*0.9,top=y+hh+Math.sin(tm*2+i)*0.6;
    rkCyl(L,cs,co,top,main?4:2,rr*1.6,i%2?[0.95,0.3,0.3]:[0.98,0.98,0.96]);rkCyl(L,cs,co,top+(main?4:2),main?2:1,rr*1.1,i%2?[0.95,0.3,0.3]:[0.98,0.98,0.96]);

function pgRocketDyn(L,tm){

  var c=S.c,ph=S.ph;

      else rkUpper(L,f[0],f[1],Math.max(yp+c.z,yp)+1,false,0,tm);
      if(ph==='drogue'||ph==='main'||ph==='splash')rkChutes(L,f[0],f[1],Math.max(yp+c.z,yp)+1,ph!=='drogue',tm);

    }

  }
}

var RKOV={stars:null};

function rkOv(S,R){

  var c=S.c,high=c.z>F9.ov||(S.s1&&S.ph!=='count'&&c.z>F9.ov);
  if(!high){cv.hidden=true;return;}
  cv.hidden=false;
  var dpr=Math.min(window.devicePixelRatio||1,2),W=cv.clientWidth,H=cv.clientHeight;if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  var g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  var alt=c.z/1000,sky=clamp((alt-20)/80,0,1);
  var gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'rgb('+Math.round(70*(1-sky))+','+Math.round(120*(1-sky))+','+Math.round(190*(1-sky)+10)+')');gr.addColorStop(1,'rgb('+Math.round(110*(1-sky)+8)+','+Math.round(160*(1-sky)+12)+','+Math.round(220*(1-sky)+30)+')');

  g.fillStyle='rgba(80,150,80,0.8)';g.beginPath();g.ellipse(cx-W*0.12,bot+12,W*0.14,10,0,0,Math.PI*2);g.fill();

  /* 1단 */
  var s=S.s1;
  function rocket(x,km,w,h,col,flame,label){var y=Y(km);g.fillStyle=col;g.fillRect(x-w/2,y-h,w,h);if(flame){g.fillStyle='rgba(255,170,60,0.95)';g.beginPath();g.moveTo(x-w/2,y);g.lineTo(x+w/2,y);g.lineTo(x,y+h*0.7);g.fill();}g.fillStyle='#fff';g.textAlign='center';g.font='700 12px system-ui,sans-serif';g.fillText(label,x,y-h-6);g.textAlign='left';}
  if(s){rocket(W*0.32,s.z/1000,8,34,'#f2f2f2',s.thr>0,s.ph==='landed'?'1단 착륙 ✅':'1단 '+fN(s.z/1000,0)+' km');}

    if(SP.mode==='eva'&&spObjStep(dt,any,a)){SP.thr=0;}else{
    var sp=Math.hypot(SP.v[0],SP.v[1],SP.v[2]);

function spRockPos(r,t){   /* 케플러 방정식으로 위치·속도 */
  var M=r.M0+r.mm*t,E=M;for(var k=0;k<8;k++)E=E-(E-r.e*Math.sin(E)-M)/(1-r.e*Math.cos(E));
  var x=r.a*(Math.cos(E)-r.e),y=r.a*Math.sqrt(1-r.e*r.e)*Math.sin(E),rad=Math.hypot(x,y),v=Math.sqrt(SPC.GM*(2/rad-1/r.a));
  var c=Math.cos(r.w),s=Math.sin(r.w);return {x:x*c-y*s,y:x*s+y*c,r:rad,v:v};
}

      exMsg('🦵 '+o.n+'을(를) 밀고 뛰어내렸어요! 나는 1.0 m/s, '+o.n+'은(는) 반대로 '+fN(ma/o.m,ma/o.m<0.01?6:3)+' m/s (질량이 '+fN(o.m/ma,0)+'배라서 그만큼 덜 움직여요)');

var AVPTS=[];

function avRects(){var R=[];AVPTS.forEach(function(a){var p=a[0],h=a[1],b=proj(p[0],p[1],p[2]),t=proj(p[0],p[1]+h,p[2]);if(!b||!t)return;var hh=Math.max(12,b.y-t.y),w=hh*0.5;R.push([b.x-w,t.y-hh*0.08,b.x+w,b.y+2]);});AVPTS=[];return R;}
function updateLabels(){
  var AR0=avRects();
  if(!use3d||(typeof syCustom==='function'&&syCustom())){LABS.forEach(function(L){L.el.style.display='none';});return;}
  var inSp=typeof SP!=='undefined'&&SP.on,AR=inSp?[]:AR0,MV=[],VIS=[];
  LABS.forEach(function(L){
    var d=L.fn();if(!d||(inSp&&!d.space)){L.el.style.display='none';return;}
    var dist=Math.hypot(d.p[0]-camPos[0],d.p[1]-camPos[1],d.p[2]-camPos[2]);
    var q=proj(d.p[0],d.p[1],d.p[2]);
    if(!q||q.x<-40||q.x>cssW+40||q.y<10||q.y>cssH-(d.far?70:10)||q.y>cssH+10||(d.far&&dist<14)||((camMode==='fol'||camMode==='fp')&&dist>230&&L.el.className.indexOf('sp')<0&&L.el.className.indexOf('hub')<0)){L.el.style.display='none';return;}
    if(camMode==='fp'){var hb=L.el.className.indexOf('hub')>=0;if(L.el.className.indexOf('sp')>=0||dist>(hb?420:110)){L.el.style.display='none';return;}}
    if(L.el.className.indexOf('hub')>=0)L.el.classList.toggle('sm',camS.dist>200);
    L.el.style.display='block';L.el.style.left=q.x+'px';L.el.style.top=q.y+'px';
    L.el.style.background=d.cls==='hit'?'#E8C9A0':'';
    if(L.el.dataset.h!==d.h){L.el.innerHTML=d.h;L.el.dataset.h=d.h;L.w=0;}
    /* 이름표가 캐릭터와 겹치면 캐릭터 머리 위로 비켜 올려요(숨기지 않아요 · 친구 이름표는 빼고) */
    var lifted=false;if(AR.length&&L.el.className.indexOf('pn')<0){if(!L.w||L.w<6){var lf=L.el.classList.contains('lift');if(lf)L.el.classList.remove('lift');L.w=L.el.offsetWidth;L.h=L.el.offsetHeight;L.h2=L.el.querySelector('small')?Math.round(L.h*0.56):L.h;if(lf)L.el.classList.add('lift');}var w=L.w,h=L.h,y=q.y;
      for(var it=0;it<3;it++){var x0=q.x-w/2,x1=q.x+w/2,y0=y-h,mv=false;
        for(var i=0;i<AR.length;i++){var r=AR[i];if(x0<r[2]&&x1>r[0]&&y0<r[3]&&y>r[1]){y=r[1]-3;mv=true;}}if(!mv)break;}
      if(y!==q.y){for(var g=0;g<12;g++){var hit=false;for(var m=0;m<MV.length;m++){var r2=MV[m];if(q.x-w/2<r2[2]&&q.x+w/2>r2[0]&&y-L.h2<r2[3]&&y>r2[1]){y=r2[1]-2;hit=true;}}if(!hit)break;}   /* 비켜 올린 이름표끼리도 겹치지 않게 쌓아요 */
        y=Math.max(h+4,y);MV.push([q.x-w/2,y-L.h2,q.x+w/2,y]);L.el.style.top=y+'px';lifted=true;}}
    if(L.el.classList.contains('lift')!==lifted)L.el.classList.toggle('lift',lifted);
    if(!L.w||L.w<6){L.w=L.el.offsetWidth;L.h=L.el.offsetHeight;L.h2=L.el.querySelector('small')?Math.round(L.h*0.56):L.h;}
    var cn=L.el.className,fy=parseFloat(L.el.style.top)||q.y;VIS.push({L:L,x:q.x,y:fy,w:L.w,h:lifted?L.h2:L.h,d:dist,p:cn.indexOf('pn')>=0?0:(cn.indexOf('hub')>=0?1:2)});
  });
  /* 이름표끼리·화면 단추와 겹치면 가까운 것만 남기고 숨겨요(좁은 휴대폰 화면에서 글자가 겹쳐 안 보이는 것 방지) */
  var UI=[],base=labelsEl.getBoundingClientRect();
  ['#pgcard','#plcard','#exmsg','#exhud','#exbtns','#exctl','#exact','#exff','#skres','#exDown','#exjump','.spbtn','#exchar','#exmenu'].forEach(function(sel){var e=document.querySelector(sel);if(!e||e.hidden||e.offsetParent===null)return;
    if(sel==='#exctl'||sel==='#exbtns'){[].forEach.call(e.querySelectorAll('button,.exjoy'),function(b){if(b.offsetParent===null)return;var r=b.getBoundingClientRect();UI.push([r.left-base.left,r.top-base.top,r.right-base.left,r.bottom-base.top]);});return;}
    var r=e.getBoundingClientRect();if(r.width>0)UI.push([r.left-base.left,r.top-base.top,r.right-base.left,r.bottom-base.top]);});
  VIS.sort(function(a,b){return a.p-b.p||a.d-b.d;});var PL=[];
  VIS.forEach(function(v){var x0=v.x-v.w/2-3,x1=v.x+v.w/2+3,y0=v.y-v.h-3,y1=v.y+2,bad=false,i;
    if(v.p>0){for(i=0;i<UI.length&&!bad;i++){var r=UI[i];if(x0<r[2]&&x1>r[0]&&y0<r[3]&&y1>r[1])bad=true;}}
    for(i=0;i<PL.length&&!bad;i++){var r2=PL[i];if(x0<r2[2]&&x1>r2[0]&&y0<r2[3]&&y1>r2[1])bad=v.p>0;}
    v.L.el.style.visibility=bad?'hidden':'';if(!bad)PL.push([x0,y0,x1,y1]);});
}

function drawChart(){

  var o=cur.out,w=Math.min(c.parentNode.clientWidth||320,700),hgt=Math.round(w/1.7),k=Math.min(window.devicePixelRatio||1,2);
  c.width=Math.round(w*k);c.height=Math.round(hgt*k);c.style.width=w+'px';c.style.height=hgt+'px';
  var g=c.getContext('2d');g.setTransform(k,0,0,k,0,0);g.fillStyle='#fff';g.fillRect(0,0,w,hgt);

  var x0=o.s0,xmax=Math.min(LTOT,Math.max(o.s[o.s.length-1]+600,x0+3000)),X=function(s){return pl0+(s-x0)/(xmax-x0)*iw;};

    ymax=1;for(i=0;i<n;i++)ymax=Math.max(ymax,o.Eg[i]);
    Y=function(e){return pt+ih-(e/ymax)*ih;};
    var ly=[[],[],[],[],[]];
    for(i=0;i<n;i++){var a=o.Ef[i],b=a+o.Ed[i],cc=b+o.Ee[i],d=cc+o.Ek[i];ly[0].push(0);ly[1].push(a);ly[2].push(b);ly[3].push(cc);ly[4].push(d);}
    var cols=['#E8833A','#0E4C6B','#3E8E4F','#C0392B'];
    for(var L=1;L<=4;L++){g.beginPath();for(i=0;i<n;i++)g.lineTo(X(o.s[i]),Y(ly[L][i]));for(i=n-1;i>=0;i--)g.lineTo(X(o.s[i]),Y(ly[L-1][i]));g.closePath();g.fillStyle=cols[L-1];g.fill();}
    for(t=0;t<=4;t++){yy=pt+ih*t/4;g.strokeStyle='#E3DED7';g.lineWidth=1;g.beginPath();g.moveTo(pl0,yy);g.lineTo(w-pr,yy);g.stroke();g.fillStyle='#111';g.textAlign='right';g.fillText(fE(ymax*(1-t/4)),pl0-3,yy+4);}
  }else{

    for(s=x0;s<=xmax;s+=200){emin=Math.min(emin,elev(s));emax=Math.max(emax,elev(s));}
    var Ye=function(e){return pt+ih-(e-emin)/(emax-emin||1)*ih;};
    g.beginPath();g.moveTo(X(x0),pt+ih);for(s=x0;s<=xmax;s+=200)g.lineTo(X(s),Ye(elev(s)));g.lineTo(X(xmax),pt+ih);g.closePath();g.fillStyle='#E7E0D0';g.fill();
    Y=function(v){return pt+ih-(v/vmax)*ih;};
    g.beginPath();for(i=0;i<n;i++)g.lineTo(X(o.s[i]),Y(o.v[i]*3.6));g.strokeStyle='#0E4C6B';g.lineWidth=3;g.stroke();
    for(t=0;t<=4;t++){yy=pt+ih*t/4;g.strokeStyle='#E3DED7';g.lineWidth=1;g.beginPath();g.moveTo(pl0,yy);g.lineTo(w-pr,yy);g.stroke();g.fillStyle='#111';g.textAlign='right';g.fillText(fN(vmax*(1-t/4),0),pl0-3,yy+4);}
  }
  g.fillStyle='#111';g.textAlign='center';
  var step=Math.max(1,Math.round((xmax-x0)/1000/6));
  for(var kx=0;kx<=Math.floor((xmax-x0)/1000);kx+=step)g.fillText(kx+'km',X(x0+kx*1000),hgt-8);
  g.setLineDash([4,4]);g.strokeStyle='#E8833A';g.lineWidth=2;
  VIL.forEach(function(v){if(v.s>xmax||v.high)return;g.lineWidth=v.hub?3:1;g.globalAlpha=v.hub?1:0.45;g.beginPath();g.moveTo(X(v.s),pt+(v.hub?10:ih*0.5));g.lineTo(X(v.s),pt+ih);g.stroke();});g.globalAlpha=1;g.lineWidth=2;
  g.setLineDash([]);g.fillStyle='#111';g.textAlign='center';VIL.forEach(function(v){if(v.hub&&v.s<=xmax)g.fillText('★'+v.ab,X(v.s),pt+8);});

function mobCardSet(el,open){el.classList.toggle('open',open);var pk=el.querySelector(':scope>.cardpeek');if(pk)pk.querySelector('i').textContent=open?'▲ 접기':'▼ 자세히';if(!open)el.scrollTop=0;}
function mobCards(){
  ['#pgcard','#plcard'].forEach(function(id){var el=$(id);if(!el)return;var pk=el.querySelector(':scope>.cardpeek');
    if(!pk){pk=document.createElement('div');pk.className='cardpeek';pk.innerHTML='<b></b><span></span><i>▼ 자세히</i>';el.insertBefore(pk,el.firstChild);
      var y0=null,moved=false;
      pk.addEventListener('pointerdown',function(e){y0=e.clientY;moved=false;try{pk.setPointerCapture(e.pointerId);}catch(x){}});
      pk.addEventListener('pointermove',function(e){if(y0==null)return;var dy=e.clientY-y0,down=MOB.port?dy:dy;if(Math.abs(dy)>28&&!moved){moved=true;mobCardSet(el,dy>0);}});
      pk.addEventListener('pointerup',function(){if(y0!=null&&!moved)mobCardSet(el,!el.classList.contains('open'));y0=null;});
      pk.addEventListener('pointercancel',function(){y0=null;});}
    if(el.hidden||!MOB.on)return;
    var rk=EX.ride?EX.ride.k:'';if(el.dataset.rk!==rk){el.dataset.rk=rk;if(rk)mobCardSet(el,rk==='dc'||rk==='like');}   /* 놀이기구를 타기 시작하면 설명은 접어서 앞이 잘 보이게 */
    var p=mobPeekText(el);if(!p)return;
    if(el.dataset.pt!==p.t){if(el.dataset.pt&&!(EX.ride&&(EX.ride.k==='dc'||EX.ride.k==='like')))mobCardSet(el,false);el.dataset.pt=p.t;}   /* 다른 설명으로 바뀌면 다시 접어요 */
    pk.querySelector('b').textContent=p.t;pk.querySelector('span').textContent=p.n;
  });
}
(function(){
  mobCheck();window.addEventListener('resize',mobCheck);window.addEventListener('orientationchange',function(){setTimeout(mobCheck,250);});
  var hud=$('#exhud');if(hud)hud.addEventListener('click',function(){if(MOB.on)hud.classList.toggle('open');});
  setInterval(mobCards,250);
  /* 우주에서는 점프 버튼 = 위로, 아래 버튼 = 아래로 (휴대폰엔 Shift 키가 없어서) */
  var dn=$('#exDown');if(dn){dn.addEventListener('pointerdown',function(e){try{dn.setPointerCapture(e.pointerId);}catch(x){}EX.keys.shift=true;e.preventDefault();});
    var up=function(){EX.keys.shift=false;};dn.addEventListener('pointerup',up);dn.addEventListener('pointercancel',up);}
  var lastSp=null;setInterval(function(){var sp=typeof SP!=='undefined'&&SP.on;if(sp===lastSp)return;lastSp=sp;var jb=$('#exjump');if(jb)jb.innerHTML=sp?'⬆<br><small>위로</small>':'점프<br><small>길게=제트팩</small>';},300);
})();
/* 휴대폰 시점: 조이스틱을 앞으로 밀면 카메라가 천천히 캐릭터 등 뒤로 따라가요(손으로 화면을 끄는 중엔 안 해요) */
function mobCamFollow(dt){
  if(!MOB.on||EX.fp||EX.lookDrag||EX.ride||(typeof SP!=='undefined'&&SP.on))return;
  var f=-EX.jy;if(f<0.25)return;
  var d=EX.hdg-EX.yaw;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
  if(Math.abs(d)>2.4)return;               /* 거의 뒤로 돌아설 때는 따라가지 않아요 */
  EX.yaw+=d*Math.min(1,dt*1.6*f);
}

/* 길게 누르기 메뉴·끌기·글자 선택 막기 (게임 화면 안에서만) */
(function(){
  var sel='#exctl,#exbtns,#exact,#exff,#exDown,.cardpeek,#exhud,#stage canvas,#gl';
  function inGame(t){return EX.on&&t&&t.closest&&t.closest(sel);}
  ['contextmenu','selectstart','dragstart'].forEach(function(ev){document.addEventListener(ev,function(e){if(inGame(e.target))e.preventDefault();},{capture:true});});
  /* 버튼 위에서 손가락이 살짝 움직여도 화면이 밀리지 않게 */
  document.addEventListener('touchmove',function(e){var t=e.target;if(EX.on&&t&&t.closest&&t.closest('#exctl,#exbtns,#exact,#exff,#exDown,.cardpeek'))e.preventDefault();},{passive:false,capture:true});
})();
/* 아이폰: 화면 확대(핀치) 제스처·튕김 스크롤이 시점 끌기를 끊지 않게 막아요 */
(function(){
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){document.addEventListener(ev,function(e){if(EX.on)e.preventDefault();},{passive:false});});
  var st=$('#stage');if(st)st.addEventListener('touchmove',function(e){if(EX.on&&!(e.target.closest&&e.target.closest('#exmenu,#pgcard.open,#plcard.open,#exhud.open,#exchar,#qrm')))e.preventDefault();},{passive:false});
})();

})();
</script></body></html>
